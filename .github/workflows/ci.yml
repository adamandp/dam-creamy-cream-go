name: Go CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify formatting
        run: |
          unformatted=$(find cmd internal tests -name '*.go' -print0 | xargs -0 gofmt -l)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - run: go mod tidy
      - name: Verify committed module files
        run: git diff --exit-code -- go.mod go.sum
      - run: go vet ./...
      - run: go test ./...
      - name: MinIO integration test
        run: |
          # Download the pinned official MinIO server binary, avoiding registry auth/pull failures.
          base=https://dl.min.io/server/minio/release/linux-amd64/archive
          release=minio.RELEASE.2025-09-07T16-13-09Z
          curl -fsSL --retry 3 "$base/$release" -o /tmp/minio
          curl -fsSL --retry 3 "$base/$release.sha256sum" | awk '{ print $1 "  /tmp/minio" }' | sha256sum --check
          chmod +x /tmp/minio
          MINIO_ROOT_USER=minioadmin MINIO_ROOT_PASSWORD=minioadmin /tmp/minio server /tmp/minio-integration-data --address :9000 >/tmp/minio-integration.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null
          MINIO_INTEGRATION=1 go test ./tests/integration -count=1 -v

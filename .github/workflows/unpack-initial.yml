name: Unpack Initial Go Source
on:
  push:
    branches:
      - feat/initial-go-fiber-gorm-port
    paths:
      - '.bootstrap/**'
      - '.github/workflows/unpack-initial.yml'
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and extract initial Go source
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/chunk00 .bootstrap/chunk01 .bootstrap/chunk02 | base64 --decode > /tmp/dam-creamy-cream-go.tar.xz
          echo "af9b2c1d18b8133aaf45526133eacdd9b57695f1e6bd6a5df6425f4e41ea580b  /tmp/dam-creamy-cream-go.tar.xz" | sha256sum --check
          tar -xJf /tmp/dam-creamy-cream-go.tar.xz
          rm -rf .bootstrap .github/workflows/unpack-initial.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: import initial Go Fiber GORM source"
          git push origin HEAD:refs/heads/feat/initial-go-fiber-gorm-port
